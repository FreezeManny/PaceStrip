name: Test

on:
  # The pull request is the gate: every change reaches main through one, so
  # testing pull requests tests everything that can land.
  pull_request:
  # For re-running against a branch without pushing an empty commit.
  workflow_dispatch:

# A newer push to the same PR makes an in-flight run obsolete — drop it rather
# than pay for a result nobody will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow never publishes anything. Release artifacts are
# built by build.yml, which is the only place that needs `contents: write`.
permissions:
  contents: read

jobs:
  # Named `test` because the Main-Protection ruleset requires that check by
  # name; renaming the job silently un-gates the branch.
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Also build the APK: analyze/test never touch the Android toolchain, so
      # a bad Gradle or AGP bump would otherwise only surface at release time.
      - run: flutter build apk --release
