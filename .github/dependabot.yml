# Keeps dependencies up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# https://containers.dev/guide/dependabot
version: 2
updates:
  # Base image and `features:` in .devcontainer — pinned to floating tags, so
  # without this they drift silently and never surface a PR.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"

  # Workflow actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    # Explicit prefix so the PR title is Conventional and the PR Title check passes.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Dart/Flutter packages (pubspec.yaml / pubspec.lock).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"

  # The Android host project: Gradle wrapper, AGP, Kotlin and any native deps
  # in android/. `pub` does not see these.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gradle:
        patterns: ["*"]
